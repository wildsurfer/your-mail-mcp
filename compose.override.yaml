# Production overrides for this machine: the mirror and index live on the 2TB
# volume as bind mounts, and the container runs as the host user so it can
# read the migrated maildir.
services:
  your-mail-mcp:
    user: "501:20"
    # Forward the whole .env into the container: compose.yaml only names the
    # example's two password variables, and this account uses its own.
    env_file:
      - .env
    volumes:
      - ./accounts.json:/config/accounts.json:ro
      - /Volumes/2TB/MailMCP/mail:/mail
      - /Volumes/2TB/MailMCP/index:/index
