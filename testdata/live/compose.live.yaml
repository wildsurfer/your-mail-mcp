# Overrides for the live end-to-end test. Run through `go test -tags live`,
# never by hand against a production stack: the project name, ports and
# volumes are all distinct so the two can coexist.
services:
  greenmail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=tester:secret
    ports:
      - "127.0.0.1:13025:3025"   # SMTP, for seeding from the test
  your-mail-mcp:
    build: .
    depends_on:
      - greenmail
    ports: !override
      - "127.0.0.1:18080:8080"
    environment:
      PUBLIC_URL: http://127.0.0.1:18080
      OAUTH_PASSPHRASE: live-test-passphrase
      LIVE_PASS: secret
      SYNC_INTERVAL: 5s
    volumes: !override
      - ./testdata/live/accounts.json:/config/accounts.json:ro
      - mail:/mail
      - index:/index
