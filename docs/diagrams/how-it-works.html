<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How your-mail-mcp works</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #f5f5f5;
    --color-ink:    #2d3142;
    --color-muted:  #4f5d75;
    --color-accent: #eb6c36;
    --font-sans:  'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono:  'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--color-muted); margin-bottom: 0.5rem;
  }
  h1 { font-family: var(--font-serif); font-size: 1.75rem; font-weight: 400; margin-bottom: 1.5rem; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">your-mail-mcp</p>
  <h1>Mail flows in one direction, and never back out</h1>

  <svg viewBox="0 0 960 560" role="img" aria-labelledby="how-it-works-title how-it-works-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="how-it-works-title">How your-mail-mcp works</title>
    <desc id="how-it-works-desc">Mail is pulled from IMAP providers into a local mirror and indexed by notmuch. The your-mail-mcp server queries that index and answers tool calls from an MCP client, which authenticates through an in-process OAuth gate. No path exists from the server back to the mail providers for writing.</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ===== zones (drawn first) ===== -->
    <rect x="32" y="72" width="192" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <rect x="48" y="76" width="116" height="12" rx="2" fill="#f5f5f5"/>
    <text x="106" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MAIL PROVIDERS</text>

    <rect x="248" y="72" width="440" height="336" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <rect x="264" y="76" width="172" height="12" rx="2" fill="#f5f5f5"/>
    <text x="350" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR MACHINE OR SERVER</text>

    <rect x="712" y="264" width="216" height="144" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <rect x="728" y="268" width="88" height="12" rx="2" fill="#f5f5f5"/>
    <text x="772" y="277" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MCP CLIENT</text>

    <!-- ===== arrows (before boxes) ===== -->
    <!-- providers -> mirror -->
    <line x1="208" y1="136" x2="272" y2="136" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <!-- mirror -> index -->
    <line x1="432" y1="136" x2="472" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- index -> server (down, into top edge) -->
    <path d="M 552,168 V 224 Q 552,232 544,232 H 404 Q 396,232 396,240 V 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- client -> gate -->
    <line x1="736" y1="336" x2="632" y2="336" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <!-- gate -> server -->
    <line x1="512" y1="336" x2="472" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- server -> client, results (dashed return, routed below the zones) -->
    <path d="M 372,376 V 416 Q 372,424 380,424 H 812 Q 820,424 820,416 V 376" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- forbidden: server -> providers, stops before the mail zone -->
    <path d="M 272,320 H 240 Q 232,320 232,312 V 224" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4"/>
    <line x1="216" y1="216" x2="248" y2="216" stroke="#eb6c36" stroke-width="2.5"/>

    <!-- ===== arrow labels ===== -->
    <rect x="216" y="116" width="48" height="12" rx="2" fill="#f5f5f5"/>
    <text x="240" y="125" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PULL ONLY</text>

    <rect x="436" y="116" width="32" height="12" rx="2" fill="#f5f5f5"/>
    <text x="452" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INDEX</text>

    <rect x="452" y="212" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="472" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

    <rect x="660" y="312" width="52" height="12" rx="2" fill="#f5f5f5"/>
    <text x="686" y="321" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOOL CALL</text>

    <rect x="568" y="400" width="48" height="12" rx="2" fill="#f5f5f5"/>
    <text x="592" y="409" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULTS</text>

    <rect x="244" y="256" width="76" height="12" rx="2" fill="#f5f5f5"/>
    <text x="282" y="265" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO WRITE PATH</text>

    <!-- ===== nodes ===== -->
    <!-- providers -->
    <rect x="48" y="104" width="160" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="48" y="104" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <rect x="56" y="110" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="72" y="119" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IMAP</text>
    <text x="128" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Your mail</text>
    <text x="128" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gmail · icloud · any</text>

    <!-- local mirror -->
    <rect x="272" y="104" width="160" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="272" y="104" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="280" y="110" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
    <text x="296" y="119" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
    <text x="352" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Local mirror</text>
    <text x="352" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mbsync → maildir</text>

    <!-- notmuch index -->
    <rect x="472" y="104" width="160" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="472" y="104" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="480" y="110" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
    <text x="498" y="119" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INDEX</text>
    <text x="552" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">notmuch index</text>
    <text x="552" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">search · threads</text>

    <!-- server (focal) -->
    <rect x="272" y="296" width="200" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="272" y="296" width="200" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="280" y="302" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
    <text x="294" y="311" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
    <text x="372" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">your-mail-mcp</text>
    <text x="372" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eleven read-only tools</text>

    <!-- oauth gate -->
    <rect x="512" y="296" width="120" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="512" y="296" width="120" height="80" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="520" y="302" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
    <text x="536" y="311" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
    <text x="572" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OAuth gate</text>
    <text x="572" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">passphrase</text>

    <!-- client -->
    <rect x="736" y="296" width="168" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="736" y="296" width="168" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <rect x="744" y="302" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
    <text x="758" y="311" fill="rgba(122,131,153,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="820" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Any MCP client</text>
    <text x="820" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">smartphone · laptop</text>

    <!-- ===== legend ===== -->
    <line x1="32" y1="472" x2="928" y2="472" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="32" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="112" y1="488" x2="140" y2="488" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="148" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">crosses the network</text>

    <line x1="300" y1="488" x2="328" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="336" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">stays on your machine</text>

    <line x1="504" y1="488" x2="532" y2="488" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="540" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">answer returned</text>

    <line x1="680" y1="488" x2="700" y2="488" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4"/>
    <line x1="704" y1="480" x2="704" y2="496" stroke="#eb6c36" stroke-width="2.5"/>
    <text x="716" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">path that does not exist</text>
  </svg>
</div>
</body>
</html>
